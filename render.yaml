services:
  - type: web
    name: shopagent-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python backend/database.py && python backend/download_model.py"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FRONTEND_URL
        value: "https://your-vercel-app-url.vercel.app"
